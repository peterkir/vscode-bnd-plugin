name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install client dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Compile (client + server)
        run: npm run compile:all

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout bnd source (CLI parity and invocation tests)
        uses: actions/checkout@v6
        with:
          repository: bndtools/bnd
          ref: fea-bnd-ls
          path: bnd-src
          sparse-checkout: |
            biz.aQute.bnd/src/aQute/bnd/main
            biz.aQute.bnd/testdata/workspace

      - name: Download bnd CLI JAR
        env:
          BND_VERSION: "7.4.0"
        run: |
          url="https://repo.maven.apache.org/maven2/biz/aQute/bnd/biz.aQute.bnd/${BND_VERSION}/biz.aQute.bnd-${BND_VERSION}.jar"
          jar="${RUNNER_TEMP}/biz.aQute.bnd.jar"
          curl -fsSL -o "$jar" "$url"
          echo "$(curl -fsSL "${url}.sha1")  ${jar}" | sha1sum -c -
          echo "BND_CLI_JAR=${jar}" >> "$GITHUB_ENV"

      - name: Test
        run: xvfb-run -a npm test
        env:
          BND_SOURCE_REPO: ${{ github.workspace }}/bnd-src

      # vsce packages the whole workspace folder.
      - name: Remove bnd source checkout
        run: rm -rf bnd-src

      - name: Package extension
        run: npm run package

      - name: Get VSIX filename
        id: vsix_name
        run: echo "name=$(node -p "require('./package.json').name + '-' + require('./package.json').version + '.vsix'")" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.vsix_name.outputs.name }}
          path: "*.vsix"
          retention-days: 30
