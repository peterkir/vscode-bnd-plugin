name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  # Reused by release.yml so a release ships the artifact of a full, tested build.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build; defaults to the ref of the calling event"
        required: false
        type: string
        default: ""
    outputs:
      vsix-name:
        description: "Name of the uploaded VSIX artifact"
        value: ${{ jobs.build.outputs.vsix_name }}

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      vsix_name: ${{ steps.vsix_name.outputs.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install client dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Verify bundled language server JARs
        run: npm run server:verify

      - name: Compile (client + server)
        run: npm run compile:all

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout bnd source (CLI parity and invocation tests)
        uses: actions/checkout@v6
        with:
          repository: bndtools/bnd
          ref: master
          path: bnd-src
          sparse-checkout: |
            biz.aQute.bnd/src/aQute/bnd/main
            biz.aQute.bnd/testdata/workspace

      - name: Download bnd CLI JAR
        env:
          BND_VERSION: "7.5.0"
        run: |
          url="https://repo.maven.apache.org/maven2/biz/aQute/bnd/biz.aQute.bnd/${BND_VERSION}/biz.aQute.bnd-${BND_VERSION}.jar"
          jar="${RUNNER_TEMP}/biz.aQute.bnd.jar"
          curl -fsSL -o "$jar" "$url"
          echo "$(curl -fsSL "${url}.sha1")  ${jar}" | sha1sum -c -
          echo "BND_CLI_JAR=${jar}" >> "$GITHUB_ENV"

      # The complete suite under c8; the coverage data is also what the summary and artifact below report.
      - name: Test with coverage
        run: xvfb-run -a npm run test:coverage
        env:
          BND_SOURCE_REPO: ${{ github.workspace }}/bnd-src

      - name: Report coverage
        if: ${{ !cancelled() && hashFiles('coverage/tmp/*.json') != '' }}
        run: |
          {
            echo "### Test coverage"
            echo
            echo '```'
            npx c8 report --reporter=text | grep -v '^\s*$'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/lcov-report
          retention-days: 30

      # vsce packages the whole workspace folder.
      - name: Remove bnd source checkout
        run: rm -rf bnd-src

      - name: Package extension
        run: npm run package

      - name: Get VSIX filename
        id: vsix_name
        run: echo "name=$(node -p "require('./package.json').name + '-' + require('./package.json').version + '.vsix'")" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.vsix_name.outputs.name }}
          path: "*.vsix"
          retention-days: 30

  # Every tested push to the default branch becomes a Marketplace pre-release
  # versioned major.(minor+1).<run number>, so it always sorts above the release it is based on.
  prerelease:
    name: Publish pre-release
    needs: build
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: prerelease-marketplace
      cancel-in-progress: false
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install client dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Compute pre-release version
        id: version
        run: echo "version=$(node scripts/release.mjs prerelease-version)" >> "$GITHUB_OUTPUT"

      - name: Stamp pre-release version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Package pre-release
        run: npm run package:prerelease

      - name: Upload pre-release VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: bnd-${{ steps.version.outputs.version }}-prerelease.vsix
          path: bnd-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error
          retention-days: 30

      - name: Publish pre-release to VS Code Marketplace
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not configured; pre-release $VERSION was packaged but not published."
            exit 0
          fi
          if node scripts/release.mjs published "$VERSION"; then
            echo "::notice::Pre-release $VERSION is already on the Marketplace; nothing to publish."
            exit 0
          fi
          npx @vscode/vsce publish --pre-release --packagePath "bnd-$VERSION.vsix"

  # Publishes the badges of README.md as shields.io endpoint files on the `badges` branch
  # (raw.githubusercontent.com/<repo>/badges/<name>.json): the line coverage of this build and the latest
  # Marketplace release and pre-release (shields.io no longer renders Marketplace badges itself).
  badges:
    name: Publish badges
    needs: [build, prerelease]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install client dependencies
        run: npm ci

      - name: Download coverage report
        uses: actions/download-artifact@v7
        with:
          name: coverage-report
          path: coverage

      - name: Create badge files
        run: |
          mkdir -p "$RUNNER_TEMP/badges"
          node scripts/coverageBadge.mjs coverage/lcov.info "$RUNNER_TEMP/badges/coverage.json"
          # The Marketplace may be unreachable; keep the previous release badges in that case.
          node scripts/release.mjs badges "$RUNNER_TEMP/badges" || echo "::warning::Marketplace versions unavailable; release badges not updated."

      - name: Commit badge files to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$repo" badges > /dev/null; then
            git clone -q --depth 1 --branch badges "$repo" "$RUNNER_TEMP/branch"
          else
            git init -q "$RUNNER_TEMP/branch"
            git -C "$RUNNER_TEMP/branch" remote add origin "$repo"
            git -C "$RUNNER_TEMP/branch" checkout -q --orphan badges
          fi
          cd "$RUNNER_TEMP/branch"
          cp "$RUNNER_TEMP"/badges/*.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Badges are up to date."
            exit 0
          fi
          git commit -q -m "Update badges for ${GITHUB_SHA}"
          git push origin badges
