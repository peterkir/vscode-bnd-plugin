name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v0.11.0)"
        required: true
        type: string
      publish:
        description: "Publish to VS Code Marketplace"
        required: false
        default: false
        type: boolean

jobs:
  release:
    name: Release to GitHub and VS Code Marketplace
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install client dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Compile (client + server)
        run: npm run compile:all

      - name: Package extension
        run: npm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: bnd ${{ inputs.tag || github.ref_name }}
          files: "*.vsix"
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' && (github.event_name == 'push' || inputs.publish) }}
        run: npx @vscode/vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
