version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    ignore:
      # @types/vscode must stay aligned with engines.vscode in package.json;
      # bumping it alone breaks `vsce package`. Remove this once
      # engines.vscode is raised to match.
      - dependency-name: "@types/vscode"

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: daily
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
